<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#050509">

  <title>Eclipse Protocol</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="game-wrapper">

    <!-- HUD -->
    <div class="hud">
      <span>
        PONTOS:
        <strong id="score">0</strong>
      </span>

      <span>
        VIDAS:
        <strong id="lives">3</strong>
      </span>
    </div>

    <!-- CANVAS DO JOGO -->
    <canvas id="gameCanvas"></canvas>


    <!-- TELA INICIAL -->
    <div id="startScreen" class="overlay">

      <h1>ECLIPSE PROTOCOL</h1>

      <p>
        Destrua os inimigos antes que eles cheguem até você.
      </p>

      <!-- Controle exibido no computador -->
      <p class="controls desktop-controls">
        ← → para mover • ESPAÇO para atirar
      </p>

      <!-- Controle exibido no celular -->
      <p class="controls mobile-controls-info">
        Use os controles na tela para jogar
      </p>

      <button id="startButton">
        JOGAR
      </button>

    </div>


    <!-- GAME OVER -->
    <div id="gameOverScreen" class="overlay hidden">

      <h1>GAME OVER</h1>

      <p>
        Pontuação:
        <strong id="finalScore">0</strong>
      </p>

      <button id="restartButton">
        JOGAR NOVAMENTE
      </button>

    </div>


    <!--
      CONTROLES MOBILE

      Eles ficam por cima do canvas e só são
      exibidos quando o dispositivo possui
      suporte a touch.
    -->
    <div id="mobileControls" class="mobile-controls">

      <button
        id="moveLeftButton"
        class="touch-button movement-button"
        aria-label="Mover para esquerda"
      >
        ◀
      </button>

      <button
        id="shootButton"
        class="touch-button shoot-button"
        aria-label="Atirar"
      >
        ●
      </button>

      <button
        id="moveRightButton"
        class="touch-button movement-button"
        aria-label="Mover para direita"
      >
        ▶
      </button>

    </div>

  </main>


  <script src="script.js"></script>

</body>
</html>
